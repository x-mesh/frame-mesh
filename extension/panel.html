<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>frame-mesh</title>
<link rel="stylesheet" href="../src/panel/panel.css">
<link rel="stylesheet" href="panel.css">
</head>
<body>
<header class="ext__top">
  <div class="ext__row">
    <span class="brand">frame-mesh</span>
    <span class="ext__target" id="tabLabel" hidden></span>
    <select id="tabSelect" data-i18n-title="ext.tabSelect" hidden></select>
    <button class="btn btn--warn" id="btnConnect" type="button" data-i18n="ext.reconnect" data-i18n-title="ext.reconnectTitle" hidden></button>
  </div>
  <div class="ext__applied is-clean" id="appliedChip" data-i18n="ext.chipClean"></div>
</header>
<section class="ext__section ext__section--tree" id="treeSection">
  <button class="ext__section-head" type="button" data-toggle="treeSection"><span data-i18n="ext.layers"></span> <span class="ext__info" data-i18n-title="ext.layersInfo">ⓘ</span></button>
  <div class="tree" id="tree"></div>
</section>
<div class="ext__splitter" id="splitter" role="separator" aria-orientation="horizontal" data-i18n-title="ext.splitter"></div>
<section class="ext__section ext__section--props" id="propsSection">
  <button class="ext__section-head" type="button" data-toggle="propsSection" data-i18n="ext.props"></button>
  <div class="props" id="props"></div>
</section>
<footer class="ext__status" id="status" data-i18n="ext.notConnected"></footer>
<div class="notice" id="notice" hidden></div>
<script type="module" src="panel.js"></script>
</body>
</html>
