<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="frame-mesh" content="host">
<title>frame-mesh workbench</title>
<link rel="stylesheet" href="src/panel/panel.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar__group">
      <span class="brand">frame-mesh</span>
      <span class="doc-name" id="docName" data-i18n="wb.noDoc"></span>
      <button class="btn" id="btnOpen" type="button" data-i18n="wb.open"></button>
      <input type="file" id="fileInput" accept=".html,.htm" hidden>
      <button class="btn" id="btnReload" type="button" data-i18n="wb.reload"></button>
      <span class="badge badge--warn" id="overflowBadge" hidden></span>
    </div>
    <div class="topbar__group">
      <div class="seg" id="vpSeg"></div>
      <label class="vp-custom"><span data-i18n="wb.width"></span> <input type="number" id="vpWidth" min="240" max="3840" step="1"> px</label>
      <span class="zoom" id="zoomLabel">100%</span>
    </div>
    <div class="topbar__group">
      <div class="seg" id="modeSeg">
        <button class="seg__btn is-active" type="button" data-mode="select" data-i18n="wb.select"></button>
        <button class="seg__btn" type="button" data-mode="interact" data-i18n="wb.interact"></button>
      </div>
      <div class="seg" id="moveSeg" data-i18n-title="move.titleWb">
        <button class="seg__btn is-active" type="button" data-move="flow" data-i18n="move.flow"></button>
        <button class="seg__btn" type="button" data-move="free" data-i18n="move.free"></button>
      </div>
      <button class="btn" id="btnMeasure" type="button" data-i18n="view.measure" data-i18n-title="view.measureTitle"></button>
      <button class="btn" id="btnXray" type="button" data-i18n="view.xray" data-i18n-title="view.xrayTitle"></button>
      <button class="btn" id="btnFocus" type="button" data-i18n="view.focus" data-i18n-title="view.focusTitle"></button>
      <button class="btn" id="btnDiffView" type="button" data-i18n="view.diff" data-i18n-title="view.diffTitle" disabled></button>
      <button class="btn" id="btnPeek" type="button" data-i18n="panel.peek" data-i18n-title="peek.title" disabled></button>
      <button class="btn" id="btnUndo" type="button" data-i18n="wb.undo" data-i18n-title="wb.undoTitle" disabled></button>
      <button class="btn" id="btnRedo" type="button" data-i18n="dock.redo" data-i18n-title="wb.redoTitle" disabled></button>
      <button class="btn btn--primary" id="btnHandoff" type="button" data-i18n="handoff.dialogTitle" data-i18n-title="wb.handoffTitle"></button>
    </div>
  </header>

  <aside class="panel panel--left">
    <div class="panel__head"><span data-i18n="ext.layers"></span> <span class="zoom" data-i18n="wb.dragHint"></span></div>
    <div class="tree" id="tree"></div>
  </aside>

  <main class="canvas" id="canvas">
    <div class="frame-box" id="frameBox">
      <div class="frame-wrap" id="frameWrap">
        <iframe id="preview" sandbox="allow-same-origin" data-i18n-title="wb.preview"></iframe>
      </div>
    </div>
  </main>

  <aside class="panel panel--right">
    <div class="panel__head" data-i18n="ext.props"></div>
    <div class="props" id="props"></div>
  </aside>

  <footer class="bottom">
    <div class="bottom__head"><span class="dock__tabs"><button class="dock__tab is-active" id="tabLog" type="button" data-i18n="tab.log"></button><button class="dock__tab" id="tabDiff" type="button" data-i18n="tab.diff"></button><button class="dock__tab" id="tabChat" type="button" data-i18n="tab.chat"></button></span> <span id="changeCount"></span><span class="bottom__actions"><button class="btn" id="btnCopyLog" type="button" data-i18n="dock.copy" data-i18n-title="wb.copyTitle"></button> <button class="btn" id="btnSendLog" type="button" data-i18n="dock.save" data-i18n-title="wb.saveTitle"></button> <button class="btn" id="btnClearLog" type="button" data-i18n="wb.clear" data-i18n-title="dock.clearTitle"></button></span></div>
    <ol class="changes" id="changes"></ol>
    <div class="diff" id="diff" hidden></div>
    <div class="chat-host" id="chat" hidden></div>
    <div class="status"><span id="status" data-i18n="wb.noDoc"></span><span id="statusRight"></span></div>
  </footer>
</div>

<dialog class="handoff" id="handoffDialog">
  <div class="handoff__head"><strong data-i18n="handoff.dialogTitle"></strong><span id="handoffSummary"></span></div>
  <p class="handoff__desc" data-i18n="handoff.descWb"></p>
  <textarea id="handoffText" readonly spellcheck="false"></textarea>
  <div class="handoff__actions">
    <button class="btn btn--primary" id="btnHandoffCopy" type="button" data-i18n="handoff.copy"></button>
    <button class="btn" id="btnHandoffMd" type="button" data-i18n="handoff.saveMd"></button>
    <button class="btn" id="btnHandoffJson" type="button" data-i18n="handoff.saveJson"></button>
    <button class="btn" id="btnHandoffClose" type="button" data-i18n="handoff.close"></button>
  </div>
</dialog>
<div class="notice" id="notice" hidden></div>
<script type="module" src="src/web/workbench.js"></script>
</body>
</html>
