# 태그(v*)를 푸시하면 확장 zip을 만들어 GitHub Release에 첨부한다. git-kit ship이 태그를 푸시하고,
# ship.watch(tools/release.sh watch)가 이 실행이 끝날 때까지 기다린다.
# 수동 실행(workflow_dispatch)은 Release 없이 zip만 만들어 Actions 아티팩트로 남긴다. 파이프라인 시험용이다.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        run: |
          version=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          echo "manifest.json version: $version"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Check syntax
        run: make check

      - name: Build the extension zip
        run: make package

      - name: Write release notes
        run: tools/release.sh notes "$VERSION" > release-notes.md

      - name: Keep the zip (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: frame-mesh-extension-v${{ env.VERSION }}
          path: dist/frame-mesh-extension-v${{ env.VERSION }}.zip

      - name: Create the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/frame-mesh-extension-$GITHUB_REF_NAME.zip" \
            --title "frame-mesh $GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
